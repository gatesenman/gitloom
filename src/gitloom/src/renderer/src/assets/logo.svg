<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>GitLoom</title>
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.55" stop-color="#4F7BFF"/>
      <stop offset="1" stop-color="#12C2C9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1B1650" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="72" y="72" width="880" height="880" rx="212" fill="url(#bg)"/>
  <rect x="72" y="72" width="880" height="880" rx="212" fill="url(#shine)"/>
  <!-- loom weft threads (behind) -->
  <g stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="30" stroke-linecap="round">
    <path d="M236 404H788"/>
    <path d="M236 520H788"/>
    <path d="M236 636H788"/>
  </g>
  <g filter="url(#shadow)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- trunk -->
    <path d="M384 262V762" stroke-width="66"/>
    <!-- feature branch woven out and merged back -->
    <path d="M384 694C384 560 648 600 648 452V350" stroke-width="66"/>
  </g>
  <!-- weft thread passing over the warp (woven effect) -->
  <path d="M300 520H468" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="30" stroke-linecap="round"/>
  <!-- commit nodes -->
  <g filter="url(#shadow)">
    <circle cx="384" cy="262" r="74" fill="#FFFFFF"/>
    <circle cx="648" cy="330" r="74" fill="#FFFFFF"/>
    <circle cx="384" cy="782" r="74" fill="#FFFFFF"/>
  </g>
  <circle cx="384" cy="262" r="34" fill="#6A63FF"/>
  <circle cx="648" cy="330" r="34" fill="#16BCC9"/>
  <circle cx="384" cy="782" r="34" fill="#4F7BFF"/>
</svg>
